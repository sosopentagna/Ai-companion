
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AI Companion</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f0ff;
      color: #302641;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 12px;
    }

    .app {
      width: 100%;
      max-width: 600px;
      height: 85vh;
      min-height: 420px;
      display: flex;
      flex-direction: column;
      background: white;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 8px 35px #38245b18;
    }

    header {
      padding: 22px;
      background: #e8dcff;
    }

    header h1 { margin: 0 0 6px; font-size: 22px; }
    header p { margin: 0; color: #685b79; font-size: 14px; }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      padding: 12px 15px;
      border-radius: 17px;
      max-width: 85%;
      line-height: 1.5;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .bot {
      align-self: flex-start;
      background: #f0eafa;
    }

    .user {
      align-self: flex-end;
      background: #8060b8;
      color: white;
    }

    form {
      display: flex;
      gap: 8px;
      padding: 14px;
      border-top: 1px solid #eee7f7;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 13px;
      border: 1px solid #ddd1ee;
      border-radius: 12px;
      font-size: 16px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 17px;
      background: #8060b8;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }
 
/* TEDDY BEAR AI FACE */

#robot-face {
  width: 220px;
  height: 145px;
  margin: 20px auto;
  background: #fff;
  border: 3px solid #d8c6f5;
  border-radius: 48% 48% 45% 45%;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 45px;
  position: relative;
  box-shadow: 0 5px 15px #d8c6f555;
}

.eye {
  width: 25px;
  height: 34px;
  background: #59447e;
  border-radius: 50%;
  position: relative;
  animation: eye-float 3s ease-in-out infinite;
}

.eye::after {
  content: "";
  position: absolute;
  top: 6px;
  right: 5px;
  width: 7px;
  height: 7px;
  background: white;
  border-radius: 50%;
}

#robot-face.blink .eye {
  transform: scaleY(0.1);
}

#robot-face.happy .eye {
  height: 14px;
  border-radius: 50% 50% 0 0;
  transform: scaleY(0.7);
}

#robot-face.sad .eye,
#robot-face.concerned .eye {
  transform: translateY(5px) scaleY(0.8);
}

#robot-face.curious .eye {
  height: 42px;
  width: 29px;
}

#robot-face.thinking .eye {
  transform: translateY(-7px);
}

#robot-face.listening .eye {
  animation: listening-pulse 1.2s ease-in-out infinite;
}

#robot-face.speaking {
  animation: speaking-bounce 0.35s ease-in-out infinite alternate;
}

#robot-face.speaking .eye {
  animation: eye-float 1s ease-in-out infinite;
}

#robot-mouth {
  position: absolute;
  left: 50%;
  top: 95px;
  transform: translateX(-50%);
  width: 28px;
  height: 10px;
  border-bottom: 3px solid #59447e;
  border-radius: 0 0 50% 50%;
  transition: all 0.25s ease;
}

#robot-face.happy #robot-mouth {
  width: 42px;
  height: 18px;
  border-bottom-width: 4px;
}

#robot-face.sad #robot-mouth {
  width: 28px;
  height: 10px;
  border-bottom: none;
  border-top: 3px solid #59447e;
  border-radius: 50% 50% 0 0;
}

#robot-face.concerned #robot-mouth {
  width: 20px;
  height: 5px;
  border-bottom: 3px solid #59447e;
}

#robot-face.curious #robot-mouth {
  width: 12px;
  height: 12px;
  border: 3px solid #59447e;
  border-radius: 50%;
}

#robot-face.thinking #robot-mouth {
  width: 22px;
  height: 3px;
  border-bottom: 3px solid #59447e;
}

#robot-face.speaking #robot-mouth {
  width: 20px;
  height: 18px;
  border: 3px solid #59447e;
  border-radius: 50%;
  background: #f0e7ff;
}

@keyframes eye-float {
  0%, 100% { margin-top: 0; }
  50% { margin-top: 4px; }
}

@keyframes listening-pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.12); }
}

@keyframes speaking-bounce {
  from { transform: translateY(0); }
  to { transform: translateY(-3px); }
}

#robot-face {
  transition: background 0.3s ease;
}

  </style>
</head>

<body>
  <main class="app">
    <header>
      <h1>♡ Your AI Companion</h1>
      <p>A little space just for conversation.</p>
    </header>

    <div id="chat" aria-live="polite">
      <div class="message bot">
        Hi! I'm your AI companion. ✨
        I'm happy to chat with you. What's on your mind?
      </div>
    </div>

    <form id="chat-form">
      <input
        id="message"
        placeholder="Write a message..."
        autocomplete="off"
        aria-label="Your message"
        required
      >
      <button type="submit">Send</button>
    </form>
  </main>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("chat-form");
    const input = document.getElementById("message");

    const API_URL = "https://script.google.com/macros/s/AKfycbw1QQrY2OKRbvMry0HOokFEWKnbPbuYS-f6hQP917TsmAiGymWGDD_4i0b7B2F9OkLN/exec";
const USER_ID_KEY = "companion_user_id";

let USER_ID = localStorage.getItem(USER_ID_KEY);

if (!USER_ID) {
  USER_ID = crypto.randomUUID();
  localStorage.setItem(USER_ID_KEY, USER_ID);
}
    // Save simple personal memories
    function rememberFact(key, value) {
      companionMemory.save(key, value);
    }

    // Recall a saved memory
    function recallFact(key) {
      return companionMemory.recall(key);
    }

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const text = input.value.trim();
      if (!text) return;

      addMessage(text, "user");
      input.value = "";

      const waiting = addMessage("Thinking... ✨", "bot");
      const callbackName = "geminiCallback" + Date.now();

      const script = document.createElement("script");

      window[callbackName] = function(data) {
        waiting.textContent =
          data.reply || "I couldn't get a reply. Please try again.";

        delete window[callbackName];
        script.remove();
      };

  script.src = API_URL +
  "?message=" + encodeURIComponent(text) +
  "&userId=" + encodeURIComponent(USER_ID) +
  "&callback=" + callbackName;    

      script.onerror = function() {
        waiting.textContent =
          "I couldn't connect right now. Please try again.";

        delete window[callbackName];
        script.remove();
      };

      document.body.appendChild(script);
    });

    function addMessage(text, type) {
      const bubble = document.createElement("div");
      bubble.className = "message " + type;
      bubble.textContent = text;
      chat.appendChild(bubble);
      chat.scrollTop = chat.scrollHeight;
      return bubble;
    }
  </script>
</body>
</html>

<script>
  // Simple memory for your AI companion
  const companionMemory = {
    save: function(key, value) {
      localStorage.setItem("companion_" + key, value);
    },

    recall: function(key) {
      return localStorage.getItem("companion_" + key);
    },

    forget: function(key) {
      localStorage.removeItem("companion_" + key);
    }
  };
</script>
