
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My AI Companion</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 12px;
  font-family: Arial, sans-serif;
  background: #f5f0ff;
  color: #302641;
  display: flex;
  justify-content: center;
  min-height: 100vh;
}

.app {
  width: 100%;
  max-width: 600px;
  height: 94vh;
  min-height: 450px;
  display: flex;
  flex-direction: column;
  background: white;
  border-radius: 22px;
  overflow: hidden;
  box-shadow: 0 8px 35px #38245b18;
}

header {
  padding: 12px;
  background: #e8dcff;
  text-align: center;
}

header h1 {
  margin: 4px 0;
  font-size: 22px;
}

header p {
  margin: 4px 0;
  color: #685b79;
  font-size: 14px;
}

/* PIXEL TEDDY BEAR */

#robot-face {
  width: 240px;
  height: 210px;
  margin: 0 auto;
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
}

#teddy-image {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  image-rendering: pixelated;
}

/* ANIMATED EYES */

.teddy-eye {
  position: absolute;
  top: 34%;
  width: 12px;
  height: 12px;
  background: #39271f;
  border-radius: 50%;
  transition: height 0.15s ease;
  pointer-events: none;
}

.teddy-eye.left {
  left: 36%;
}

.teddy-eye.right {
  right: 36%;
}

.teddy-eye::after {
  content: "";
  position: absolute;
  top: 2px;
  right: 2px;
  width: 3px;
  height: 3px;
  background: white;
  border-radius: 50%;
}

#robot-face.blink .teddy-eye {
  height: 2px;
}

#robot-face.curious .teddy-eye {
  height: 15px;
}

#robot-face.thinking .teddy-eye {
  transform: translateY(-2px);
}

#robot-face.listening .teddy-eye {
  animation: listen 1.2s ease-in-out infinite;
}

#robot-face.speaking .teddy-eye {
  animation: listen 0.7s ease-in-out infinite;
}

@keyframes listen {
  50% {
    transform: scale(1.12);
  }
}

/* EXPRESSION BUTTONS */

#expression-controls {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 5px;
}

#expression-controls button {
  padding: 7px 9px;
  font-size: 12px;
  border-radius: 10px;
}

button {
  border: 0;
  border-radius: 12px;
  padding: 12px 17px;
  background: #8060b8;
  color: white;
  font-size: 14px;
  cursor: pointer;
}

#chat {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.message {
  padding: 12px 15px;
  border-radius: 17px;
  max-width: 85%;
  line-height: 1.5;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}

.bot {
  align-self: flex-start;
  background: #f0eafa;
}

.user {
  align-self: flex-end;
  background: #8060b8;
  color: white;
}

form {
  display: flex;
  gap: 8px;
  padding: 14px;
  border-top: 1px solid #eee7f7;
}

input {
  flex: 1;
  min-width: 0;
  padding: 13px;
  border: 1px solid #ddd1ee;
  border-radius: 12px;
  font-size: 16px;
}
</style>
</head>

<body>

<main class="app">

<header>
  <div id="robot-face" class="happy">
    <img
      id="teddy-image"
      src="./teddy.png"
      alt="Pixel art teddy bear"
    >

    <div class="teddy-eye left"></div>
    <div class="teddy-eye right"></div>
  </div>

  <h1>♡ Your AI Companion</h1>
  <p>A little space just for conversation.</p>

  <div id="expression-controls">
    <button type="button" onclick="setFaceExpression('happy')">Happy</button>
    <button type="button" onclick="setFaceExpression('sad')">Sad</button>
    <button type="button" onclick="setFaceExpression('curious')">Curious</button>
    <button type="button" onclick="setFaceExpression('concerned')">Concerned</button>
    <button type="button" onclick="setFaceExpression('thinking')">Thinking</button>
    <button type="button" onclick="setFaceExpression('listening')">Listening</button>
    <button type="button" onclick="setFaceExpression('speaking')">Speaking</button>
  </div>
</header>

<div id="chat" aria-live="polite">
  <div class="message bot">
    Hi! I'm your AI companion. ✨
    I'm happy to chat with you. What's on your mind?
  </div>
</div>

<form id="chat-form">
  <input
    id="message"
    placeholder="Write a message..."
    autocomplete="off"
    aria-label="Your message"
    required
  >
  <button type="submit">Send</button>
</form>

</main>

<script>
/* TEDDY EXPRESSIONS */

const face = document.getElementById("robot-face");

function setFaceExpression(expression) {
  const allowed = [
    "happy",
    "sad",
    "curious",
    "concerned",
    "thinking",
    "listening",
    "speaking"
  ];

  if (allowed.includes(expression)) {
    face.className = expression;
  }
}

/* AUTOMATIC BLINKING */

function blinkEyes() {
  if (face.classList.contains("speaking")) return;

  face.classList.add("blink");

  setTimeout(function() {
    face.classList.remove("blink");
  }, 150);
}

function scheduleBlink() {
  blinkEyes();
  setTimeout(scheduleBlink, 3000 + Math.random() * 2000);
}

setTimeout(scheduleBlink, 2500);

/* AI CONNECTION */

const chat = document.getElementById("chat");
const form = document.getElementById("chat-form");
const input = document.getElementById("message");

const API_URL = "https://script.google.com/macros/s/AKfycbw1QQrY2OKRbvMry0HOokFEWKnbPbuYS-f6hQP917TsmAiGymWGDD_4i0b7B2F9OkLN/exec";

const USER_ID_KEY = "companion_user_id";

let USER_ID = localStorage.getItem(USER_ID_KEY);

if (!USER_ID) {
  USER_ID = crypto.randomUUID();
  localStorage.setItem(USER_ID_KEY, USER_ID);
}

/* SIMPLE LOCAL MEMORY */

const companionMemory = {
  save: function(key, value) {
    localStorage.setItem("companion_" + key, value);
  },

  recall: function(key) {
    return localStorage.getItem("companion_" + key);
  },

  forget: function(key) {
    localStorage.removeItem("companion_" + key);
  }
};

function rememberFact(key, value) {
  companionMemory.save(key, value);
}

function recallFact(key) {
  return companionMemory.recall(key);
}

/* FACE RESPONDS TO CHAT */

input.addEventListener("focus", function() {
  setFaceExpression("listening");
});

input.addEventListener("input", function() {
  setFaceExpression(input.value.trim() ? "listening" : "happy");
});

/* SEND A MESSAGE */

form.addEventListener("submit", function(event) {
  event.preventDefault();

  const text = input.value.trim();

  if (!text) return;

  addMessage(text, "user");
  input.value = "";

  setFaceExpression("thinking");

  const waiting = addMessage("Thinking... ✨", "bot");
  const callbackName = "geminiCallback" + Date.now();
  const script = document.createElement("script");

  let finished = false;

  window[callbackName] = function(data) {
    if (finished) return;

    finished = true;

    waiting.textContent =
      data.reply || "I couldn't get a reply. Please try again.";

    delete window[callbackName];
    script.remove();

    if (data.reply) {
      setFaceExpression("speaking");

      setTimeout(function() {
        if (face.classList.contains("speaking")) {
          setFaceExpression("happy");
        }
      }, 1800);
    } else {
      setFaceExpression("concerned");
    }
  };

  script.src = API_URL +
    "?message=" + encodeURIComponent(text) +
    "&userId=" + encodeURIComponent(USER_ID) +
    "&callback=" + callbackName;

  script.onerror = function() {
    if (finished) return;

    finished = true;

    waiting.textContent =
      "I couldn't connect right now. Please try again.";

    setFaceExpression("concerned");

    delete window[callbackName];
    script.remove();
  };

  document.body.appendChild(script);
});

/* ADD CHAT MESSAGES */

function addMessage(text, type) {
  const bubble = document.createElement("div");

  bubble.className = "message " + type;
  bubble.textContent = text;

  chat.appendChild(bubble);
  chat.scrollTop = chat.scrollHeight;

  return bubble;
}
</script>

</body>
</html>
